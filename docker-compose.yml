services:
  postgres:
    image: postgres:16-alpine
    container_name: miniledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miniledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miniledger_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-miniledger}
      # Keeps initdb deterministic across host locales.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - miniledger_pgdata:/var/lib/postgresql/data
      # Creates the `miniledger_test` database on first start.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miniledger} -d ${POSTGRES_DB:-miniledger}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  miniledger_pgdata:
